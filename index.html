<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>520 · 予你满心欢喜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "Arial Rounded MT Bold", sans-serif;
 }
        body {
            background: linear-gradient(135deg, #ffc1e9, #ff7eb6, #ff4d94); /* 帅气粉渐变，不艳俗 */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
 position: relative;
        }
        /* 爱心飘落动画 */
        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #fff;
            transform: rotate(45deg);
            opacity: 0.8;
            animation: fall linear infinite;
        }
        .heart::before, .heart::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #fff;
            border-radius: 50%;
        }
        .heart::before {
            top: -10px;
            left: 0;
        }
        .heart::after {
            left: -10px;
            top: 0;
        }
        @keyframes fall {
            0% {
                transform: rotate(45deg) translateY(-100vh) scale(0.3);
                opacity: 0;
            }
10% {
                opacity: 0.8;
 }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: rotate(45deg) translateY(100vh) scale(0.3);
                opacity: 0;
            }
        }
        /* 表白卡片 */
        .confession-card {
            background: rgba(255, 255, 255, 0.95); /* 半透明白，高级感 */
 padding: 60px 80px;
            border-radius: 20px;
            box-shadow: 0 10px 50px rgba(255, 77, 148, 0.3); /* 粉色阴影，更浪漫 */
            text-align: center;
            z-index: 10;
            max-width: 600px;
            width: 90%;
        }
        .confession-card h1 {
            color: #ff4d94;
            font-size: 48px;
            margin-bottom: 20px;
            letter-spacing: 5px;
            text-shadow: 2px 2px 4px rgba(255, 126, 182, 0.5);
        }
        .confession-card .subtitle {
            color: #ff7eb6;
            font-size: 20px;
            margin-bottom: 40px;
            font-style: italic;
        }
        .confession-card .content {
            color: #333;
            font-size: 22px;
            line-height: 1.8;
            margin-bottom: 50px;
        }
        /* 520数字装饰 */
        .num-520 {
            font-size: 60px;
            font-weight: bold;
            color: #ff4d94;
            margin: 30px 0;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
 50% {
                transform: scale(1.1);
                color: #ff7eb6;
            }
        }
        /* 按钮样式 */
        .btn {
            padding: 15px 40px;
            background: linear-gradient(90deg, #ff4d94, #ff7eb6);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 77, 148, 0.4);
        }
        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(255, 77, 148, 0.6);
            background: linear-gradient(90deg, #ff7eb6, #ff4d94);
        }
        /* 响应式适配手机 */
        @media (max-width: 768px) {
            .confession-card {
                padding: 40px 20px;
            }
            .confession-card h1 {
                font-size: 36px;
            }
            .confession-card .content {
                font-size: 18px;
            }
            .num-520 {
                font-size: 48px;
 }
        }
    </style>
</head>
<body>
    <!-- 爱心飘落效果容器 -->
    <div id="hearts"></div>

    <!-- 表白卡片 -->
    <div class="confession-card">
        <h1>小静静~</h1>
        <p class="subtitle">From 满心欢喜的我 ❤️</p>
        <div class="num-520">520</div>
        <div class="content">
            遇见你的那一刻，风都变得温柔<br>
            三餐四季，岁岁年年<br>
            我想和你，从心动到白首<br>
            往后余生，满眼是你，满心也是你
        </div>
        <button class="btn" onclick="alert('谢谢你，愿意走进我的生命里❤️')">接受我的心意</button>
    </div>

 <!-- 爱心飘落脚本 -->
    <script>
        // 生成随机爱心
        function createHearts() {
            const heartsContainer = document.getElementById('hearts');
            const heartCount = 50; // 爱心数量

            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart');

                // 随机位置
                heart.style.left = `${Math.random() * 100}vw`;
                // 随机大小
                const size = Math.random() * 20 + 10;
                heart.style.width = `${size}px`;
                heart.style.height = `${size}px`;
                // 随机动画时长
                heart.style.animationDuration = `${Math.random() * 10 + 5}s`;
                // 随机延迟
                heart.style.animationDelay = `${Math.random() * 5}s`;
                // 随机透明度
                heart.style.opacity = Math.random() * 0.6 + 0.2;

 heartsContainer.appendChild(heart);
            }
        }

        // 页面加载完成后生成爱心
        window.onload = createHearts;
    </script>
</body>
</html>
